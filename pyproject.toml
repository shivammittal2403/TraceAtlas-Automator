[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "traceatlas-automator"
version = "0.4.0"
description = "Evidence-first, analyst-in-the-loop OSINT workflow automation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "RedKross Research Foundation"}]
dependencies = []

[project.scripts]
traceatlas = "traceatlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "traceatlas-automator"
version = "1.3.0"
description = "Evidence-first, AI-assisted and analyst-in-the-loop OSINT workflow automation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "RedKross Research Foundation"}]
dependencies = []

[project.scripts]
traceatlas = "traceatlas.cli:main"
traceatlas-worker = "traceatlas.worker_cli:main"
traceatlas-research = "traceatlas.research_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"traceatlas.research.data" = ["*.json", "*.jsonl.gz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

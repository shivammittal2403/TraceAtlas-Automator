name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install .
      - name: Compile sources
        run: python -m compileall -q src tests api vercel_control.py scripts
      - name: Run regression suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Validate launchers and JavaScript
        run: bash -n setup.sh start.sh set.sh && node --check public/app.js && node --check public/legacy.js
      - name: Verify research pack integrity
        run: traceatlas-research status --verify > /dev/null
      - name: Scan committed source for secrets
        run: python scripts/check_secrets.py

  supply-chain:
    name: Supply chain evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip wheel --no-deps . -w dist
      - run: python scripts/generate_sbom.py
      - run: sha256sum dist/* artifacts/sbom.cdx.json > artifacts/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: traceatlas-supply-chain
          path: |
            dist/*
            artifacts/*
          if-no-files-found: error
          retention-days: 14

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

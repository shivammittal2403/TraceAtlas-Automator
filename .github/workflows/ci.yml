name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install .
      - name: Compile sources
        run: python -m compileall -q src tests api vercel_control.py scripts
      - name: Run regression suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Validate launchers and JavaScript
        run: bash -n setup.sh start.sh set.sh && node --check public/app.js && node --check public/legacy.js && node --check public/graph-model.js && node --check public/employee.js
      - name: Verify graph model and Python export interoperability
        run: node --test tests/test_graph_model.cjs tests/test_target_validation.cjs
      - name: Install pinned local verification tools
        run: npm exec --yes --package=pnpm@11.19.0 -- pnpm install --frozen-lockfile --ignore-scripts
      - name: Execute database migrations and tenant replay regressions
        run: node --test tests/test_database.mjs
      - name: Install browser and verify fixture-backed analyst flow
        run: |
          node node_modules/playwright/cli.js install --with-deps chromium
          node tests/test_employee_ui.cjs
      - name: Verify research pack integrity
        run: traceatlas-research status --verify > /dev/null
      - name: Run AI evidence-contract benchmark
        run: traceatlas benchmark --json
      - name: Run complete controlled workforce investigations and offline replay
        run: |
          mkdir -p artifacts
          traceatlas workforce golden > artifacts/workforce-golden.json
          python -c "import json; assert json.load(open('artifacts/workforce-golden.json'))['passed']"
          traceatlas workforce golden --source-fabric > artifacts/source-fabric-golden.json
          python -c "import json; r=json.load(open('artifacts/source-fabric-golden.json')); assert r['passed'] == r['total'] == 60"
      - name: Verify governed OpenCTI connector snapshot
        run: |
          traceatlas opencti-connectors doctor --json
          traceatlas opencti-connectors verify
          python scripts/build_opencti_connector_registry.py \
            --root third_party/opencti-connectors \
            --output /tmp/opencti_connectors.json \
            --archive-sha256 dfefff461b0e5718c0455bd890cde0b54d077c361cec8d4c97a0f08658c43452 \
            --upstream-commit 55ca0dfa4129050cb607fdaf6b1a7457e0ae3476
          cmp src/traceatlas/data/opencti_connectors.json /tmp/opencti_connectors.json
      - name: Exercise local backup and restore path
        run: |
          traceatlas --workspace ci-cases init ci-case --title "CI restore drill" --purpose "Non-production integrity verification"
          traceatlas --workspace ci-cases operations restore-drill --output "artifacts/restore-${{ matrix.python-version }}" --json
      - uses: actions/upload-artifact@v7
        with:
          name: traceatlas-restore-drill-${{ matrix.python-version }}
          path: artifacts/restore-${{ matrix.python-version }}/*
          if-no-files-found: error
          retention-days: 14
      - name: Scan committed source for secrets
        run: python scripts/check_secrets.py

  supply-chain:
    name: Supply chain evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip wheel --no-deps . -w dist
      - run: python scripts/generate_sbom.py
      - run: sha256sum dist/* artifacts/sbom.cdx.json > artifacts/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: traceatlas-supply-chain
          path: |
            dist/*
            artifacts/*
          if-no-files-found: error
          retention-days: 14

  openosint-runtime:
    name: Bundled OpenOSINT runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install locked runtime and test dependencies
        run: |
          python -m pip install uv==0.12.17
          UV_PROJECT_ENVIRONMENT="$GITHUB_WORKSPACE/.openosint-test-venv" \
            uv sync --locked --extra dev --project packages/openosint
      - name: Run preserved runtime suite
        env:
          PYTHONPATH: packages/openosint
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
          ALL_PROXY: ""
        run: |
          .openosint-test-venv/bin/python -m pytest packages/openosint/tests -q \
            --ignore=packages/openosint/tests/test_docs_consistency.py \
            --ignore=packages/openosint/tests/test_playbooks.py \
            --ignore=packages/openosint/tests/test_sponsor_metrics.py \
            --ignore=packages/openosint/tests/test_sponsors.py
      - name: Verify Source Fabric against the locked MCP SDK
        env:
          PYTHONPATH: src
        run: .openosint-test-venv/bin/python -m unittest discover -s tests -p test_source_fabric.py -v

  worker-image:
    name: Private worker image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Build non-root worker image
        run: docker build --file worker/Dockerfile --tag traceatlas-worker:test .
      - name: Smoke-test worker entrypoint
        run: docker run --rm --entrypoint traceatlas-worker traceatlas-worker:test --help
      - name: Assert non-root runtime user
        run: test "$(docker run --rm --entrypoint id traceatlas-worker:test -u)" != "0"

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

name: Vendor pinned Awesome OSINT catalogue

on:
  push:
    branches: [integrate/awesome-osint-catalog-20261016]
    paths: ['.github/workflows/vendor-awesome-osint.yml']

permissions:
  contents: write

jobs:
  vendor-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout target branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Retrieve exact upstream snapshot without submodules
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$(mktemp -d)"
          git -C "$source_dir" init -q
          git -C "$source_dir" remote add origin https://github.com/osintshifu/awesome-osint-repos.git
          git -C "$source_dir" fetch --depth=1 origin d2cb55dcceb445d45ce08ef58d75c9a6f23daa97
          git -C "$source_dir" checkout -q --detach d2cb55dcceb445d45ce08ef58d75c9a6f23daa97
          test "$(git -C "$source_dir" rev-parse 'HEAD^{tree}')" = f823ffb73ea4933d7a8130bdf5911c0be0d0dd66
          dest=integrations/awesome-osint-repos
          test ! -e "$dest"
          mkdir -p "$dest"
          git -C "$source_dir" archive HEAD | tar -x -C "$dest"
          count="$(find "$dest" -type f | wc -l | tr -d ' ')"
          test "$count" = 39
          printf 'Pinned source tree verified; imported %s files into %s\n' "$count" "$dest"
      - name: Compile, inspect source, and validate exact catalogue
        shell: bash
        run: |
          set -euo pipefail
          dest=integrations/awesome-osint-repos
          python -m compileall -q "$dest/.catalog/scripts" "$dest/.catalog/gui" "$dest/tests"
          python -m unittest discover -s "$dest/tests" -v
          python "$dest/.catalog/scripts/render_catalog.py" --check
          python "$dest/.catalog/scripts/validate_catalog.py"
          node --check "$dest/.catalog/gui/app.js"
          python scripts/check_python_structure.py
          python - <<'PY'
          import csv, pathlib, importlib.util
          root=pathlib.Path('integrations/awesome-osint-repos')
          with (root/'osint-repositories.csv').open(encoding='utf-8-sig',newline='') as fh:
              rows=list(csv.DictReader(fh))
          assert len(rows)==497, len(rows)
          urls=[r['Repository'] for r in rows]
          assert len(set(urls))==len(urls)
          spec=importlib.util.spec_from_file_location('catalogue_server',root/'.catalog/gui/server.py')
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          data=mod.load_catalog()
          assert data['meta']['count']==497
          print('CSV uniqueness, catalogue API load, and entry count: PASS')
          PY
      - name: Commit complete vendored snapshot, remove one-shot installer
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/vendor-awesome-osint.yml
          git add -A integrations/awesome-osint-repos
          git diff --cached --check
          test "$(git diff --cached --name-only -- integrations/awesome-osint-repos | wc -l | tr -d ' ')" = 39
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'vendor: preserve and test complete pinned awesome-osint-repos snapshot'
          git push origin HEAD:integrate/awesome-osint-catalog-20261016
          echo 'Vendored all 39 upstream files; one-shot workflow removed.'

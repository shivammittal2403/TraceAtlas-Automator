name: Vendor three OSINT source snapshots

on:
  push:
    branches:
      - integration/vendor-osint-source-20261015

permissions:
  contents: write

jobs:
  copy-actual-source:
    if: github.repository == 'shivammittal2403/TraceAtlas-Automator' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          submodules: false

      - name: Checkout pinned sources
        run: git submodule update --init -- third_party/theHarvester third_party/OSINT-SPY third_party/Mr.Holmes

      - name: Copy pinned Git files without executing third-party code
        run: python3 scripts/vendor_osint_sources.py

      - name: Reject discovered secrets before staging
        run: python3 scripts/check_secrets.py

      - name: Commit actual source files to this integration branch
        run: |
          git add -f -A -- vendor_sources
          if git diff --cached --quiet; then
            echo "Vendor source is unchanged"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "vendor(osint): include real third-party source snapshots for GitHub browsing"
          git push origin "HEAD:refs/heads/integration/vendor-osint-source-20261015"

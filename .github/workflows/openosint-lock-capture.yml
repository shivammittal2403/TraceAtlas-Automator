name: OpenOSINT lock capture

on:
  push:
    branches:
      - codex/capture-openosint-lock-20261023
  pull_request:
    paths:
      - "packages/openosint/pyproject.toml"
      - ".github/workflows/openosint-lock-capture.yml"

permissions:
  contents: read

jobs:
  capture:
    name: Resolve and print OpenOSINT lock
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.12.17
      - name: Resolve lock with bounded network and time
        env:
          UV_HTTP_TIMEOUT: "10"
          UV_HTTP_CONNECT_TIMEOUT: "5"
          UV_HTTP_RETRIES: "0"
        run: |
          timeout --kill-after=10s --signal=TERM 5m uv lock --verbose --project packages/openosint
          python -c 'import base64,pathlib; print("TRACEATLAS_LOCK_BEGIN"); print(base64.b64encode(pathlib.Path("packages/openosint/uv.lock").read_bytes()).decode()); print("TRACEATLAS_LOCK_END")'

name: Employee integration lock repair

on:
  pull_request:
    paths: ['.github/workflows/employee-lock-repair.yml']

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.17
      - name: Regenerate stale bundled runtime lock for updated manifest
        run: uv lock --project packages/openosint
      - name: Export generated lock for review
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          content = base64.b64encode(Path("packages/openosint/uv.lock").read_bytes()).decode("ascii")
          print("TRACEATLAS_LOCK_BEGIN")
          for offset in range(0, len(content), 1000):
              print(content[offset:offset+1000])
          print("TRACEATLAS_LOCK_END")
          PY

name: Dedicated discipline employees

on:
  pull_request:
    paths:
      - 'EMPLOYEES PYTHON.py'
      - 'scripts/build_employee_bundle.py'
      - 'EMPLOYEE_INPUTS.md'
      - 'src/traceatlas/workforce/**'
      - 'src/traceatlas/skills/procedures/**'
      - 'tests/test_workforce_result_integrity.py'
      - 'tests/test_hypothesis_review.py'
      - 'tests/test_investigation_pipeline.py'
      - 'tests/fixtures/legacy14_replay_fixture.py'
      - 'src/traceatlas/osint_taxonomy.py'
      - 'tests/test_discipline*.py'
      - 'tests/test_*employees.py'
      - 'examples/employees/**'
      - 'EMPLOYEES_README.md'
      - 'pyproject.toml'
      - '.github/workflows/discipline-employees.yml'
  push:
    branches: [main]
    paths:
      - 'src/traceatlas/workforce/**'
      - 'src/traceatlas/skills/procedures/**'
      - 'tests/test_workforce_result_integrity.py'
      - 'tests/test_hypothesis_review.py'
      - 'tests/test_investigation_pipeline.py'
      - 'tests/fixtures/legacy14_replay_fixture.py'
      - 'tests/test_discipline*.py'
      - 'tests/test_*employees.py'
      - '.github/workflows/discipline-employees.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discipline-employees-${{ github.ref }}
  cancel-in-progress: true

jobs:
  employees:
    name: Employees / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - name: Employee discipline semantics, contracts and case lifecycle
        run: python -m unittest discover -s tests -p 'test_discipline*.py' -v
      - name: Existing specialist employee regressions
        run: python -m unittest discover -s tests -p 'test_*employees.py' -v
      - name: CLI employee catalog
        run: traceatlas-employees catalog
      - name: CLI with real supplied records
        run: traceatlas-employees analyze DNSINT --input examples/employees/dns.json --output employee-dns.json
      - name: Verify supplied-record CLI analysis
        run: python -c "import json; r=json.load(open('employee-dns.json')); assert r['metrics']['cname_cycles']==1; assert r['model_calls']==0"
      - name: Existing workforce regression
        run: python -m unittest discover -s tests -p test_ai_workforce.py -v
      - name: Canonical workforce result integrity
        run: python -m unittest discover -s tests -p test_workforce_result_integrity.py -v
      - name: Canonical competing assertion review
        run: python -m unittest discover -s tests -p test_hypothesis_review.py -v
      - name: Investigation products and semantic replay
        run: python -m unittest discover -s tests -p test_investigation_pipeline.py -v
      - uses: actions/checkout@v7
        with:
          ref: b8fe5e3d94ab797c9fac3630447def09c1f74503
          path: .legacy-runtime
          submodules: false
          persist-credentials: false
      - name: Produce genuine legacy case using pinned runtime
        env:
          PYTHONPATH: ${{ github.workspace }}/.legacy-runtime/src
        run: python tests/fixtures/legacy14_replay_fixture.py create --workspace "${{ runner.temp }}/traceatlas-legacy14-case" --receipt "${{ runner.temp }}/traceatlas-legacy14-receipt.json"
      - name: Verify legacy case with current runtime
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python tests/fixtures/legacy14_replay_fixture.py verify --workspace "${{ runner.temp }}/traceatlas-legacy14-case" --receipt "${{ runner.temp }}/traceatlas-legacy14-receipt.json"

      - name: Build the complete downloadable employee source bundle
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          python scripts/build_employee_bundle.py --output artifacts/TraceAtlas_Employees_All140.zip
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          name: TraceAtlas_Employees_All140
          path: artifacts/TraceAtlas_Employees_All140.zip
          if-no-files-found: error
          retention-days: 30
